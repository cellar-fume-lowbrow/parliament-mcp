services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - parliament-mcp-network
    # Note: Qdrant container doesn't include curl, so we'll rely on port availability
    # The service is healthy if it's responding on port 6333

  mcp-server:
    build:
      context: .
      dockerfile: ./Dockerfile.mcp-server
    container_name: mcp-server
    ports:
      - "${MCP_PORT}:${MCP_PORT}"
    environment:
      # The code reads QDRANT_URL; localhost from .env would point at this container, not Qdrant
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - path: .env
        required: true
    extra_hosts:
      # Lets the container reach Ollama on the host on Linux (automatic on Docker Desktop)
      - "host.docker.internal:host-gateway"
    networks:
      - parliament-mcp-network
    depends_on:
      - qdrant

volumes:
  qdrant_data:
    driver: local

networks:
  parliament-mcp-network:
    driver: bridge
